<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="sd-logo-title">
  <title id="sd-logo-title">Spatial Desktop logo — interface rings around a neural core</title>
  <!-- outer interface ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#8ecdff" stroke-width="36"/>
  <!-- inner interface ring -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#8ecdff" stroke-width="22" opacity="0.45"/>
  <!-- neural core -->
  <circle cx="256" cy="256" r="54" fill="#8ecdff"/>
  <!-- orbit node on the outer ring, 45 degrees -->
  <circle cx="380" cy="132" r="32" fill="#f4f6fa"/>
  <circle cx="380" cy="132" r="32" fill="none" stroke="#05060c" stroke-width="10"/>
</svg>
