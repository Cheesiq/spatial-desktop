<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#05060c" />
    <title>Spatial Desktop</title>
    <style>
      /* Features this install doesn't have are hidden (see src/capabilities.ts). */
      [hidden] { display: none !important; }
      /* Material 3 baseline dark scheme. */
      :root {
        --md-primary: #d0bcff; --md-on-primary: #381e72;
        --md-primary-container: #4f378b; --md-on-primary-container: #eaddff;
        --md-secondary-container: #4a4458; --md-on-secondary-container: #e8def8;
        --md-surface-container: #211f26; --md-surface-container-high: #2b2930;
        --md-on-surface: #e6e0e9; --md-on-surface-variant: #cac4d0;
        --md-outline: #938f99; --md-outline-variant: #49454f;
        --md-inverse-surface: #e6e0e9; --md-inverse-on-surface: #322f35; --md-inverse-primary: #6750a4;
        --md-font: 'Roboto', 'Google Sans', 'Noto Sans', system-ui, sans-serif;
        --md-elevation-2: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 6px 2px rgb(0 0 0 / 0.15);
        --md-elevation-3: 0 1px 3px rgb(0 0 0 / 0.3), 0 4px 8px 3px rgb(0 0 0 / 0.15);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; }
      #scene-container { position: fixed; inset: 0; }

      #hud {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483647;
        font-family: var(--md-font); color: var(--md-on-surface);
        display: flex; flex-direction: column; align-items: center; pointer-events: none;
      }
      #hud > * { pointer-events: auto; }
      #hud-body { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
      #hud.collapsed #hud-body { display: none; }

      /* Snackbar */
      #status {
        background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
        border-radius: 4px; padding: 14px 16px; font-size: 14px; letter-spacing: 0.25px;
        box-shadow: var(--md-elevation-3); max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
      }
      #status:empty { display: none; }
      #status.active::before { content: '⌨  '; color: var(--md-inverse-primary); font-weight: 500; }

      /* Input chips for open panels */
      #panels { list-style: none; margin: 0; padding: 0 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      #panels:empty { display: none; }
      #panels li {
        display: flex; align-items: center; height: 32px; max-width: 240px; box-sizing: border-box;
        padding-left: 12px; border-radius: 8px; border: 1px solid var(--md-outline);
        background: var(--md-surface-container); color: var(--md-on-surface-variant);
        font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
      }
      #panels li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #panels li button { width: 32px; height: 30px; margin-left: 2px; border-radius: 0 8px 8px 0; color: inherit; }

      /* Bottom app bar */
      .app-bar {
        box-sizing: border-box; width: 100%; min-height: 80px; padding: 12px 16px;
        background: var(--md-surface-container); box-shadow: var(--md-elevation-2);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px;
      }
      .nav { display: flex; gap: 4px; }
      .spacer { flex: 1 1 0; min-width: 0; }

      button { font: inherit; border: 0; background: none; padding: 0; cursor: pointer; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
      svg { width: 24px; height: 24px; fill: currentColor; flex: none; }

      /* Navigation-bar style destinations: icon in a pill indicator, label below. */
      .dest {
        width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        color: var(--md-on-surface-variant); font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
        overflow: visible;
      }
      .dest .indicator {
        width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center;
        position: relative; overflow: hidden; transition: background-color 200ms;
      }
      .dest .label { white-space: nowrap; }
      .dest.active { color: var(--md-on-surface); }
      .dest.active .indicator { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

      /* State layers (hover 8%, press 12%) */
      .state::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity 150ms; pointer-events: none; }
      .state:hover::after, button:hover > .state::after { opacity: 0.08; }
      .state:active::after, button:active > .state::after { opacity: 0.12; }

      /* Ripple */
      .ripple-wave {
        position: absolute; border-radius: 50%; background: currentColor; opacity: 0.16; pointer-events: none;
        transform: scale(0); animation: ripple 450ms cubic-bezier(0.2, 0, 0, 1) forwards;
      }
      @keyframes ripple { to { transform: scale(1); opacity: 0; } }

      /* Slider */
      .slider { display: flex; align-items: center; gap: 12px; padding: 0 8px; color: var(--md-on-surface-variant); font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
      .slider .name { white-space: nowrap; }
      #abundance-value { min-width: 2.6em; color: var(--md-on-surface); font-variant-numeric: tabular-nums; }
      input[type='range'] {
        -webkit-appearance: none; appearance: none; width: 140px; height: 44px; background: transparent; cursor: pointer; margin: 0;
        --fill: 35%;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 16px; border-radius: 8px;
        background: linear-gradient(to right, var(--md-primary) 0 var(--fill), var(--md-secondary-container) var(--fill) 100%);
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none; width: 4px; height: 44px; margin-top: -14px; border-radius: 2px; background: var(--md-primary);
        box-shadow: 0 0 0 6px var(--md-surface-container);
      }
      input[type='range']::-moz-range-track { height: 16px; border-radius: 8px; background: var(--md-secondary-container); }
      input[type='range']::-moz-range-progress { height: 16px; border-radius: 8px; background: var(--md-primary); }
      input[type='range']::-moz-range-thumb { width: 4px; height: 44px; border: 0; border-radius: 2px; background: var(--md-primary); }
      input[type='range']:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; border-radius: 8px; }

      /* FAB and icon buttons */
      .fab {
        width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
        background: var(--md-primary-container); color: var(--md-on-primary-container); box-shadow: var(--md-elevation-3);
      }
      .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--md-on-surface-variant); }
      #show {
        display: none; position: fixed; right: 16px; bottom: 16px;
        width: 40px; height: 40px; border-radius: 12px; place-items: center;
        background: var(--md-surface-container-high); color: var(--md-primary); box-shadow: var(--md-elevation-3);
      }
      #hud.collapsed #show { display: grid; }

      #meta { font-size: 11px; letter-spacing: 0.4px; color: var(--md-on-surface-variant); opacity: 0.7; text-align: center; padding: 0 16px; }
      #meta:empty { display: none; }

      @media (max-width: 640px) {
        .spacer { display: none; }
        .slider { order: 10; flex-basis: 100%; justify-content: center; }
        .dest { width: 60px; }
        .dest .indicator { width: 56px; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hud">
      <div id="hud-body">
        <div id="status" role="status"></div>
        <ul id="panels"></ul>
        <div id="meta"></div>
        <div class="app-bar">
          <div class="nav">
            <button id="vm" class="dest" title="Add the Windows VM (V)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg></span>
              <span class="label">Windows</span>
            </button>
            <button id="hyprland" class="dest" title="Add Hyprland itself as a panel (D) · / to search apps on it">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.4V9.7zm8 10v-6.6l6-3.4v6.6l-6 3.4z"/></svg></span>
              <span class="label">Hyprland</span>
            </button>
            <button id="layout" class="dest" title="Cycle layout (L)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
              <span class="label">Arc</span>
            </button>
            <button id="xr" class="dest" title="Enter or exit VR">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M20.74 6H3.21C2.55 6 2 6.57 2 7.28v10.44c0 .7.55 1.28 1.23 1.28h4.79c.52 0 .96-.33 1.14-.79l1.4-3.48c.23-.59.79-1.01 1.44-1.01s1.21.42 1.45 1.01l1.39 3.48c.19.46.63.79 1.11.79h4.79c.71 0 1.26-.57 1.26-1.28V7.28c0-.7-.55-1.28-1.26-1.28zM7.5 14.62c-1.17 0-2.13-.95-2.13-2.12 0-1.17.96-2.13 2.13-2.13s2.12.96 2.12 2.13-.95 2.12-2.12 2.12zm9 0c-1.17 0-2.13-.95-2.13-2.12 0-1.17.96-2.13 2.13-2.13s2.12.96 2.12 2.13-.95 2.12-2.12 2.12z"/></svg></span>
              <span class="label">VR</span>
            </button>
            <button id="launcher" class="dest" title="Show or hide the 3D launcher (A)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></span>
              <span class="label">Launcher</span>
            </button>
            <button id="music" class="dest" title="Toggle music (M)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></span>
              <span class="label">Music</span>
            </button>
            <button id="sounds" class="dest" title="Toggle UI sounds (S)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
              <span class="label">Sounds</span>
            </button>
          </div>
          <span class="spacer"></span>
          <label class="slider" title="Chance of a note on each step: 0 is a bare drone, 1 is lush">
            <span class="name">p(abundance)</span>
            <input id="abundance" type="range" min="0" max="1" step="0.05" />
            <output id="abundance-value"></output>
          </label>
          <span class="spacer"></span>
          <button id="add" class="fab state" title="Add a window (N)" aria-label="Add a window">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button id="hide" class="icon-btn state" title="Hide controls (H)" aria-label="Hide controls">
            <svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
          </button>
        </div>
      </div>
      <button id="show" class="state" title="Show controls (H)" aria-label="Show controls">
        <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
      </button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
