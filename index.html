<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#05060c" />
    <title>Spatial Desktop</title>
    <style>
      /* Features this install doesn't have are hidden (see src/capabilities.ts). */
      [hidden] { display: none !important; }
      /* Material 3 baseline dark scheme. */
      :root {
        --md-primary: #d0bcff; --md-on-primary: #381e72;
        --md-primary-container: #4f378b; --md-on-primary-container: #eaddff;
        --md-secondary-container: #4a4458; --md-on-secondary-container: #e8def8;
        --md-surface-container: #211f26; --md-surface-container-high: #2b2930;
        --md-on-surface: #e6e0e9; --md-on-surface-variant: #cac4d0;
        --md-outline: #938f99; --md-outline-variant: #49454f;
        --md-inverse-surface: #e6e0e9; --md-inverse-on-surface: #322f35; --md-inverse-primary: #6750a4;
        --md-font: 'Roboto', 'Google Sans', 'Noto Sans', system-ui, sans-serif;
        --md-elevation-2: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 6px 2px rgb(0 0 0 / 0.15);
        --md-elevation-3: 0 1px 3px rgb(0 0 0 / 0.3), 0 4px 8px 3px rgb(0 0 0 / 0.15);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; }
      #scene-container { position: fixed; inset: 0; }

      #hud {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483647;
        font-family: var(--md-font); color: var(--md-on-surface);
        display: flex; flex-direction: column; align-items: center; pointer-events: none;
      }
      #hud > * { pointer-events: auto; }
      #hud-body { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
      #hud.collapsed #hud-body { display: none; }

      /* Snackbar */
      #status {
        background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
        border-radius: 4px; padding: 14px 16px; font-size: 14px; letter-spacing: 0.25px;
        box-shadow: var(--md-elevation-3); max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
      }
      #status:empty { display: none; }
      /* Snackbar with an action: a newer Android release is out (src/update.ts). */
      #update {
        display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 16px; border-radius: 4px; font-size: 14px;
        background: var(--md-inverse-surface); color: var(--md-inverse-on-surface); box-shadow: var(--md-elevation-3);
        max-width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
      }
      #update span { flex: 1; padding-right: 8px; }
      #update a, #update button { color: var(--md-inverse-primary); font-weight: 500; text-decoration: none; padding: 10px 12px; border-radius: 20px; }
      #update button { color: var(--md-inverse-on-surface); }
      #status.active::before { content: '⌨  '; color: var(--md-inverse-primary); font-weight: 500; }

      /* Input chips for open panels */
      #panels { list-style: none; margin: 0; padding: 0 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      #panels:empty { display: none; }
      #panels li {
        display: flex; align-items: center; height: 32px; max-width: 240px; box-sizing: border-box;
        padding-left: 12px; border-radius: 8px; border: 1px solid var(--md-outline);
        background: var(--md-surface-container); color: var(--md-on-surface-variant);
        font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
      }
      #panels li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #panels li button { width: 32px; height: 30px; margin-left: 2px; border-radius: 0 8px 8px 0; color: inherit; }

      /* Bottom app bar */
      .app-bar {
        box-sizing: border-box; width: 100%; min-height: 80px; padding: 12px 16px;
        background: var(--md-surface-container); box-shadow: var(--md-elevation-2);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px;
      }
      .nav { display: flex; gap: 4px; }
      .spacer { flex: 1 1 0; min-width: 0; }

      button { font: inherit; border: 0; background: none; padding: 0; cursor: pointer; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
      svg { width: 24px; height: 24px; fill: currentColor; flex: none; }

      /* Navigation-bar style destinations: icon in a pill indicator, label below. */
      .dest {
        width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        color: var(--md-on-surface-variant); font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
        overflow: visible;
      }
      .dest .indicator {
        width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center;
        position: relative; overflow: hidden; transition: background-color 200ms;
      }
      .dest .label { white-space: nowrap; }
      .dest.active { color: var(--md-on-surface); }
      .dest.active .indicator { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

      /* State layers (hover 8%, press 12%) */
      .state::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity 150ms; pointer-events: none; }
      .state:hover::after, button:hover > .state::after { opacity: 0.08; }
      .state:active::after, button:active > .state::after { opacity: 0.12; }

      /* Ripple */
      .ripple-wave {
        position: absolute; border-radius: 50%; background: currentColor; opacity: 0.16; pointer-events: none;
        transform: scale(0); animation: ripple 450ms cubic-bezier(0.2, 0, 0, 1) forwards;
      }
      @keyframes ripple { to { transform: scale(1); opacity: 0; } }

      /* Slider */
      .slider { display: flex; align-items: center; gap: 12px; padding: 0 8px; color: var(--md-on-surface-variant); font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
      .slider .name { white-space: nowrap; }
      #abundance-value { min-width: 2.6em; color: var(--md-on-surface); font-variant-numeric: tabular-nums; }
      input[type='range'] {
        -webkit-appearance: none; appearance: none; width: 140px; height: 44px; background: transparent; cursor: pointer; margin: 0;
        --fill: 35%;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 16px; border-radius: 8px;
        background: linear-gradient(to right, var(--md-primary) 0 var(--fill), var(--md-secondary-container) var(--fill) 100%);
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none; width: 4px; height: 44px; margin-top: -14px; border-radius: 2px; background: var(--md-primary);
        box-shadow: 0 0 0 6px var(--md-surface-container);
      }
      input[type='range']::-moz-range-track { height: 16px; border-radius: 8px; background: var(--md-secondary-container); }
      input[type='range']::-moz-range-progress { height: 16px; border-radius: 8px; background: var(--md-primary); }
      input[type='range']::-moz-range-thumb { width: 4px; height: 44px; border: 0; border-radius: 2px; background: var(--md-primary); }
      input[type='range']:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; border-radius: 8px; }

      /* FAB and icon buttons */
      .fab {
        width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
        background: var(--md-primary-container); color: var(--md-on-primary-container); box-shadow: var(--md-elevation-3);
      }
      .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--md-on-surface-variant); }
      #show {
        display: none; position: fixed; right: 16px; bottom: 16px;
        width: 40px; height: 40px; border-radius: 12px; place-items: center;
        background: var(--md-surface-container-high); color: var(--md-primary); box-shadow: var(--md-elevation-3);
      }
      #hud.collapsed #show { display: grid; }

      #meta { font-size: 11px; letter-spacing: 0.4px; color: var(--md-on-surface-variant); opacity: 0.7; text-align: center; padding: 0 16px; }
      #meta:empty { display: none; }

      @media (max-width: 640px) {
        .spacer { display: none; }
        .slider { order: 10; flex-basis: 100%; justify-content: center; }
        .dest { width: 60px; }
        .dest .indicator { width: 56px; }
      }

      /* ---- Rogue Protocol (src/game) ---- */
      body.rp-active #hud { display: none; }
      .rp {
        --rp-cyan: #5ad8ff; --rp-ice: #9ff0ff; --rp-red: #ff4d6d; --rp-gold: #ffd166; --rp-violet: #b89cff;
        --rp-font: 'JetBrains Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'SF Mono', Menlo, monospace;
        position: fixed; inset: 0; z-index: 2147483646; pointer-events: none; color: #eaf6ff;
        font-family: var(--rp-font); text-transform: uppercase; letter-spacing: 0.08em; user-select: none;
      }
      .rp canvas.rp-arrows { position: absolute; inset: 0; width: 100%; height: 100%; }
      .rp-vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 60, 0.55) 100%); }
      .rp.rp-critical .rp-vignette { animation: rp-pulse 0.9s ease-in-out infinite; }
      @keyframes rp-pulse { 50% { opacity: 0.45; } }
      .rp-top { position: absolute; top: 20px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
      .rp-left { display: flex; align-items: baseline; gap: 14px; }
      .rp-score { font-size: 40px; font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 0 18px rgba(90, 216, 255, 0.6); font-variant-numeric: tabular-nums; }
      .rp-mult { font-size: 24px; font-weight: 700; color: var(--rp-gold); text-shadow: 0 0 12px rgba(255, 209, 102, 0.7); }
      .rp-wave { text-align: center; display: grid; gap: 2px; }
      .rp-wave b { font-size: 18px; letter-spacing: 0.3em; color: var(--rp-ice); }
      .rp-wave span { font-size: 12px; letter-spacing: 0.2em; color: rgba(234, 246, 255, 0.6); text-transform: none; }
      .rp-best { font-size: 13px; letter-spacing: 0.2em; color: rgba(234, 246, 255, 0.55); padding-top: 8px; }
      .rp-boss { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); width: min(560px, 70vw); text-align: center; display: grid; gap: 6px; }
      .rp-boss span { font-size: 12px; letter-spacing: 0.25em; color: var(--rp-red); }
      .rp-boss .rp-bar { height: 8px; }
      .rp-boss .rp-bar i { background: linear-gradient(90deg, #ff2e52, #ff8c1f); box-shadow: 0 0 14px #ff2e52; }
      .rp-boss.rp-shielded .rp-bar i { background: repeating-linear-gradient(90deg, #ff8c1f 0 10px, #7a3a10 10px 14px); }
      .rp-banner { position: absolute; top: 30%; left: 0; right: 0; text-align: center; display: grid; gap: 10px; }
      .rp-banner b { font-size: clamp(28px, 5vw, 64px); font-weight: 800; letter-spacing: inherit; text-shadow: 0 0 30px rgba(90, 216, 255, 0.8); }
      .rp-banner span { font-size: 14px; letter-spacing: 0.25em; color: var(--rp-ice); text-transform: none; }
      .rp-cross { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); display: none; }
      .rp.rp-playing .rp-cross { display: block; }
      .rp-cross svg { width: 40px; height: 40px; fill: var(--rp-ice); stroke: var(--rp-ice); stroke-width: 2; filter: drop-shadow(0 0 4px var(--rp-cyan)); }
      .rp-cross .hm { stroke: #fff; opacity: 0; }
      .rp-cross.rp-hit .hm { opacity: 1; }
      .rp-bars { position: absolute; left: 28px; bottom: 28px; width: min(320px, 40vw); display: grid; gap: 10px; }
      .rp-row { display: grid; grid-template-columns: 72px 1fr; align-items: center; font-size: 12px; letter-spacing: 0.2em; color: rgba(234, 246, 255, 0.7); }
      .rp-bar { height: 10px; background: rgba(255, 255, 255, 0.1); clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
      .rp-bar i { display: block; height: 100%; transition: width 120ms linear; }
      .rp-hull .rp-bar i { background: linear-gradient(90deg, #2fd27a, #6dffa0); box-shadow: 0 0 12px #6dffa0; }
      .rp-hull.rp-low .rp-bar i { background: var(--rp-red); box-shadow: 0 0 12px var(--rp-red); }
      .rp-shield .rp-bar i { background: linear-gradient(90deg, #2a8cff, var(--rp-cyan)); box-shadow: 0 0 12px var(--rp-cyan); }
      .rp-novas { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.2em; color: rgba(234, 246, 255, 0.7); }
      .rp-novas span { width: 72px; }
      .rp-novas i { width: 14px; height: 14px; transform: rotate(45deg); background: var(--rp-violet); box-shadow: 0 0 12px var(--rp-violet); }
      .rp-novas em { font-style: normal; opacity: 0.5; }
      .rp-overdrive { font-size: 13px; color: var(--rp-gold); letter-spacing: 0.2em; text-shadow: 0 0 10px var(--rp-gold); min-height: 1em; }
      .rp-radar { position: absolute; right: 28px; bottom: 28px; width: 200px; height: 200px; }
      .rp-menu {
        position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, rgba(3, 6, 16, 0.35), rgba(3, 6, 16, 0.8)); text-align: center; padding: 24px; box-sizing: border-box;
      }
      .rp-kicker { font-size: 12px; letter-spacing: 0.5em; color: rgba(159, 240, 255, 0.75); }
      .rp-logo {
        margin: 0; font-size: clamp(48px, 10vw, 128px); line-height: 0.88; font-weight: 800; letter-spacing: 0.06em; color: #fff;
        text-shadow: 0 0 24px rgba(90, 216, 255, 0.9), 0 0 60px rgba(90, 120, 255, 0.6);
      }
      .rp-logo span { color: transparent; -webkit-text-stroke: 2px var(--rp-red); text-shadow: 0 0 26px rgba(255, 46, 82, 0.8); letter-spacing: 0.12em; }
      .rp-tag { margin: 0; font-size: 15px; letter-spacing: 0.12em; text-transform: none; color: var(--rp-ice); }
      .rp-title { margin: 0; font-size: clamp(36px, 7vw, 84px); font-weight: 800; letter-spacing: 0.14em; text-shadow: 0 0 30px rgba(90, 216, 255, 0.8); }
      .rp-title.rp-red { color: var(--rp-red); text-shadow: 0 0 30px rgba(255, 46, 82, 0.8); }
      .rp-final { display: grid; gap: 4px; }
      .rp-final span { font-size: 12px; letter-spacing: 0.4em; color: rgba(234, 246, 255, 0.6); }
      .rp-final b { font-size: 56px; text-shadow: 0 0 20px rgba(90, 216, 255, 0.7); }
      .rp-small { margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: none; color: rgba(234, 246, 255, 0.7); }
      .rp-small em { color: var(--rp-gold); font-style: normal; }
      .rp-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
      .rp-btn {
        font: 700 14px var(--rp-font); letter-spacing: 0.2em; text-transform: uppercase; color: var(--rp-ice); padding: 14px 26px;
        border: 1px solid rgba(90, 216, 255, 0.5); background: rgba(10, 30, 50, 0.55); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        transition: background 120ms, color 120ms;
      }
      .rp-btn:hover { background: rgba(90, 216, 255, 0.2); color: #fff; }
      .rp-btn.rp-primary { background: var(--rp-cyan); color: #04111c; border-color: var(--rp-cyan); padding: 16px 44px; font-size: 16px; box-shadow: 0 0 30px rgba(90, 216, 255, 0.6); }
      .rp-btn.rp-primary:hover { background: #fff; }
      .rp-keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; max-width: 760px; font-size: 12px; letter-spacing: 0.08em; text-transform: none; color: rgba(234, 246, 255, 0.65); }
      .rp-keys b { color: var(--rp-ice); font-weight: 700; margin-right: 4px; }

      /* On-screen touch controls (src/game/touch.ts). They fade out after a few
         seconds without a touch; any touch brings them back. */
      .rp-touchpad {
        position: fixed; inset: 0; z-index: 2147483646; touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: var(--rp-font, ui-monospace, monospace);
        --rp-safe-r: max(20px, env(safe-area-inset-right, 0px)); --rp-safe-b: max(18px, env(safe-area-inset-bottom, 0px));
      }
      .rp-touchpad > * { transition: opacity 600ms ease; }
      .rp-touchpad.rp-faded > * { opacity: 0; }
      .rp-stick {
        position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; pointer-events: none;
      }
      .rp-stick::before, .rp-knob {
        content: ''; position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
      }
      .rp-stick::before { left: 0; top: 0; width: 124px; height: 124px; border: 2px solid rgba(90, 216, 255, 0.45); background: rgba(10, 30, 50, 0.25); }
      .rp-knob { left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; transform: none; background: rgba(90, 216, 255, 0.55); box-shadow: 0 0 18px rgba(90, 216, 255, 0.6); }
      .rp-stick.rp-on { opacity: 1; }
      .rp-touchpad.rp-faded .rp-stick.rp-on { opacity: 1; }
      .rp-tbtn {
        position: absolute; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 50%;
        color: #eaf6ff; background: rgba(10, 30, 50, 0.35); border: 2px solid rgba(90, 216, 255, 0.55);
        font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
      }
      .rp-tbtn svg { width: 42%; height: 42%; fill: currentColor; }
      .rp-tbtn.rp-held { background: rgba(90, 216, 255, 0.45); transform: scale(0.94); }
      .rp-t-fire { right: var(--rp-safe-r); bottom: var(--rp-safe-b); width: 92px; height: 92px; border-color: rgba(255, 77, 109, 0.8); background: rgba(80, 10, 25, 0.35); }
      .rp-t-fire.rp-held { background: rgba(255, 77, 109, 0.5); }
      .rp-t-shield { right: calc(var(--rp-safe-r) + 104px); bottom: var(--rp-safe-b); width: 66px; height: 66px; }
      .rp-t-nova { right: calc(var(--rp-safe-r) + 12px); bottom: calc(var(--rp-safe-b) + 104px); width: 62px; height: 62px; border-color: rgba(184, 156, 255, 0.8); background: rgba(40, 20, 80, 0.35); }
      .rp-t-pause { right: calc(var(--rp-safe-r) + 136px); top: max(14px, env(safe-area-inset-top, 0px)); width: 44px; height: 44px; }
      .rp-t-pause span { display: none; }
      .rp-t-gyro { right: calc(var(--rp-safe-r) + 190px); top: max(14px, env(safe-area-inset-top, 0px)); width: 44px; height: 44px; opacity: 0.55; }
      .rp-t-gyro span { display: none; }
      .rp-t-gyro.rp-lit { opacity: 1; color: #04111c; background: rgba(90, 216, 255, 0.85); }
      .rp-touchpad.rp-faded .rp-t-gyro { opacity: 0; }

      /* Touch layout: bars and radar move up, clear of the thumbs. */
      .rp.rp-touch .rp-bars { top: 66px; bottom: auto; left: max(20px, env(safe-area-inset-left, 0px)); width: min(260px, 32vw); gap: 6px; }
      .rp.rp-touch .rp-radar { top: 12px; bottom: auto; right: max(16px, env(safe-area-inset-right, 0px)); width: 110px; height: 110px; }
      .rp.rp-touch .rp-best { display: none; }
      .rp.rp-touch .rp-wave { position: absolute; left: 50%; transform: translateX(-50%); }
      .rp.rp-touch .rp-row, .rp.rp-touch .rp-novas { font-size: 10px; }
      /* Short screens (phones in landscape): a compact HUD and a menu that fits. */
      @media (max-height: 520px) {
        .rp-score { font-size: 26px; }
        .rp-mult { font-size: 16px; }
        .rp-top { top: 12px; }
        .rp-banner { top: 22%; }
        .rp-banner b { font-size: 30px; }
        .rp-boss { top: 58px; }
        .rp-menu { gap: 10px; justify-content: center; }
        .rp-logo { font-size: clamp(36px, 13vh, 72px); }
        .rp-title { font-size: 36px; }
        .rp-final b { font-size: 36px; }
        .rp-btn { padding: 11px 20px; font-size: 13px; }
        .rp-btn.rp-primary { padding: 12px 32px; }
        .rp-kicker, .rp-tag { font-size: 11px; }
        .rp-keys { font-size: 11px; gap: 4px 12px; }
      }
      @media (max-width: 640px) {
        .rp-score { font-size: 28px; }
        .rp-radar { width: 130px; height: 130px; right: 16px; bottom: 16px; }
        .rp-bars { left: 16px; bottom: 16px; width: 46vw; }
        .rp-top { left: 16px; right: 16px; top: 12px; }
        .rp-best { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hud">
      <div id="hud-body">
        <div id="update" role="status" hidden><span></span><a target="_blank" rel="noopener">Download</a><button type="button" aria-label="Dismiss">✕</button></div>
        <div id="status" role="status"></div>
        <ul id="panels"></ul>
        <div id="meta"></div>
        <div class="app-bar">
          <div class="nav">
            <button id="vm" class="dest" title="Add the Windows VM (V)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg></span>
              <span class="label">Windows</span>
            </button>
            <button id="macos" class="dest" title="Add the macOS VM (O)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/></svg></span>
              <span class="label">macOS</span>
            </button>
            <button id="hyprland" class="dest" title="Add Hyprland itself as a panel (D) · / to search apps on it">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.4V9.7zm8 10v-6.6l6-3.4v6.6l-6 3.4z"/></svg></span>
              <span class="label">Hyprland</span>
            </button>
            <button id="play" class="dest" title="Play Rogue Protocol (G)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M21.58 16.09l-1.09-7.66A3.996 3.996 0 0 0 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66a2.545 2.545 0 0 0 4.33 2.16L9 16h6l2.24 2.24a2.545 2.545 0 0 0 4.34-2.15zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg></span>
              <span class="label">Play</span>
            </button>
            <button id="layout" class="dest" title="Cycle layout (L)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
              <span class="label">Arc</span>
            </button>
            <button id="xr" class="dest" title="Enter or exit VR">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M20.74 6H3.21C2.55 6 2 6.57 2 7.28v10.44c0 .7.55 1.28 1.23 1.28h4.79c.52 0 .96-.33 1.14-.79l1.4-3.48c.23-.59.79-1.01 1.44-1.01s1.21.42 1.45 1.01l1.39 3.48c.19.46.63.79 1.11.79h4.79c.71 0 1.26-.57 1.26-1.28V7.28c0-.7-.55-1.28-1.26-1.28zM7.5 14.62c-1.17 0-2.13-.95-2.13-2.12 0-1.17.96-2.13 2.13-2.13s2.12.96 2.12 2.13-.95 2.12-2.12 2.12zm9 0c-1.17 0-2.13-.95-2.13-2.12 0-1.17.96-2.13 2.13-2.13s2.12.96 2.12 2.13-.95 2.12-2.12 2.12z"/></svg></span>
              <span class="label">VR</span>
            </button>
            <button id="launcher" class="dest" title="Show or hide the 3D launcher (A)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></span>
              <span class="label">Launcher</span>
            </button>
            <button id="music" class="dest" title="Toggle music (M)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></span>
              <span class="label">Music</span>
            </button>
            <button id="sounds" class="dest" title="Toggle UI sounds (S)">
              <span class="indicator state"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
              <span class="label">Sounds</span>
            </button>
          </div>
          <span class="spacer"></span>
          <label class="slider" title="Chance of a note on each step: 0 is a bare drone, 1 is lush">
            <span class="name">p(abundance)</span>
            <input id="abundance" type="range" min="0" max="1" step="0.05" />
            <output id="abundance-value"></output>
          </label>
          <span class="spacer"></span>
          <button id="add" class="fab state" title="Add a window (N)" aria-label="Add a window">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
          <button id="hide" class="icon-btn state" title="Hide controls (H)" aria-label="Hide controls">
            <svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
          </button>
        </div>
      </div>
      <button id="show" class="state" title="Show controls (H)" aria-label="Show controls">
        <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
      </button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
